<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Experia Survey Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — top bar with laser chip, laser-target strip, step rail, working panel. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --ink:#0f2a33; --muted:#5b7079; --line:#d6e0e3;
  --accent:#0b6e7f; --accent-soft:#e1f0f2; --signal:#c26a12; --signal-soft:#fbefe1;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c0392b; --bad-soft:#fbe9e7; --na:#7d8b91; --na-soft:#eef1f2;
  --grid:#e2ecee; --grid-major:#c5dade;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0b1619; --panel:#112227; --ink:#e3eef0; --muted:#8fa6ad; --line:#21393f;
  --accent:#4fb8c9; --accent-soft:#163a41; --signal:#e9a14f; --signal-soft:#3a2a16;
  --ok:#4cc583; --ok-soft:#14352a; --bad:#ef7a6c; --bad-soft:#3c1d1a; --na:#8a9a9f; --na-soft:#1b2c31;
  --grid:#15292f; --grid-major:#21444d; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:16px}
textarea{width:100%;resize:vertical;min-height:40px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.warn{color:var(--bad)}
.btn:disabled{opacity:.45}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.sitepick{display:flex;gap:8px;align-items:center}
.sitepick select{max-width:260px}
.laserchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;background:var(--bg)}
.laserchip .dot{width:9px;height:9px;border-radius:50%;background:var(--na)}
.laserchip.on .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.laserchip .lv{border-radius:6px;padding:0 4px;font-family:var(--f-mono);font-size:13px;font-weight:600;min-width:64px}
.laserchip .btn{border-radius:99px}
.targetbar{position:sticky;top:var(--topH,58px);z-index:15;background:var(--signal-soft);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.targetbar b{color:var(--signal)}
.targetbar .tlabel{font-weight:600}
.flash{animation:fl .7s ease}
@keyframes fl{0%{background:var(--signal);color:var(--panel)}100%{}}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.step .t{font-weight:600;display:block}
.step .s{display:block;font-size:12px;color:var(--muted)}
.step[aria-current="true"]{background:var(--accent-soft)}
.step[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
main{padding:22px 26px 60px;min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--signal);font-weight:600}
.example{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--na-soft);color:var(--muted);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* devices */
.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.dev{border:1.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.dev[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dev b{font-family:var(--f-display);font-size:16px}
.dev .count{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:6px 0 18px}

/* groups and rows */
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.group>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.group>header .meta{font-size:12px;color:var(--muted)}
.cathead{padding:8px 16px 2px}
.req{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start;scroll-margin-top:140px}
.req:last-child{border-bottom:0}
.req .txt{min-width:0}
.req .txt b{font-weight:600}
.req .spec{font-family:var(--f-mono);font-size:13px;color:var(--accent);display:block}
.req.off{opacity:.5}
.req.off .txt b{text-decoration:line-through}
.req.targeted{background:var(--signal-soft);box-shadow:inset 4px 0 0 var(--signal)}
.prev{font-size:12.5px;color:var(--bad);margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.mand{border-color:var(--accent);color:var(--accent)}
.tag.extra{border-color:var(--signal);color:var(--signal)}
.ownersel{display:inline-flex;gap:4px;align-items:center;border-color:var(--accent);color:var(--accent)}
.ownersel select{border:0;background:transparent;padding:0 2px;font-size:12px;font-weight:600;color:var(--accent)}
.tag.auto{border-color:var(--ok);color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--panel);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.respline{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg.resp button{padding:6px 10px;font-size:12.5px}
.seg .on-req{background:var(--accent-soft);color:var(--accent)}
.seg .on-ok{background:var(--ok-soft);color:var(--ok)}
.seg .on-bad{background:var(--bad-soft);color:var(--bad)}
.seg .on-na{background:var(--na-soft);color:var(--na)}
.sx{grid-column:1/-1;display:grid;grid-template-columns:200px 1fr auto;gap:8px;align-items:start}
.meas{display:flex;gap:0}
.meas input{border-top-right-radius:0;border-bottom-right-radius:0;width:100%}
.meas .tg{border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:var(--panel);padding:0 11px;cursor:pointer;font-weight:700;color:var(--signal)}
.meas .tg[aria-pressed="true"]{background:var(--signal);color:var(--panel);border-color:var(--signal)}
.linked{font-family:var(--f-mono);font-size:13px;padding:8px 10px;border:1px dashed var(--accent);border-radius:8px;color:var(--accent)}
.photos{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.photos img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.photobtn{position:relative;overflow:hidden}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.addrow{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;padding:12px 16px;background:var(--bg)}
.statusbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.meter{flex:1;min-width:150px;height:8px;border-radius:99px;background:var(--na-soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.filters .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* plan */
.planwrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.canvasbox{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);touch-action:none}
canvas#plan{display:block;width:100%;touch-action:none}
.pop{position:absolute;background:var(--panel);border:1.5px solid var(--signal);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;width:230px;z-index:3}
.pop .row input{width:100px}
.side{display:flex;flex-direction:column;gap:12px}
.dirpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dirpad button{padding:10px 0;font-size:18px}
.dirpad button[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.walllist{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;margin:0;padding:0;list-style:none}
.walllist li{display:grid;grid-template-columns:70px 28px 1fr;gap:6px;align-items:center;font-size:13px}
.walllist input{width:100%;padding:5px 8px;font-family:var(--f-mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-weight:600;text-align:right}
.hint{font-size:12.5px;color:var(--muted)}
.legend{display:grid;grid-template-columns:18px 1fr;gap:5px 8px;font-size:12.5px;align-items:center}
.legend i{width:14px;height:14px;border-radius:3px;display:block}

/* report */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.tile.hero{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tile.hero .k{color:inherit;opacity:.75}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.matrix td.ck,.matrix th.ck{text-align:center;width:72px;font-weight:700;color:var(--accent);font-size:16px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--bg)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--na-soft);color:var(--na)}
.planimg{width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gallery figure{margin:0;font-size:11.5px;color:var(--muted)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fbimg{width:100%;border:1px solid var(--line);border-radius:8px;-webkit-touch-callout:default;display:block;margin-top:8px}
.fb{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
pre.csv{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-mono);font-size:12px;max-height:180px;overflow:auto;white-space:pre}
.signoff{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:22px}
.signoff div{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
.modal img{width:100%;border-radius:8px}

@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .step{grid-template-columns:24px auto;flex-shrink:0;padding:7px 10px}
  .step .n{width:24px;height:24px}
  .step .s,.rail .sep{display:none}
  main{padding:18px 16px 60px}
  .planwrap,.cols{grid-template-columns:1fr}
  .sx{grid-template-columns:170px 1fr}
  .sx .photos{grid-column:1/-1}
}
@media (max-width:560px){
  .req{grid-template-columns:1fr}
  .sx{grid-template-columns:1fr}
  .addrow{grid-template-columns:1fr}
  .brand span{display:none}
}
@media print{
  .top,.targetbar,.rail,.noprint,.toast{display:none!important}
  .shell{display:block} main{padding:0}
  body{background:#fff;color:#000}
  .tile.hero{background:#fff;color:#000;border-color:#000}
  .cols{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><b>Survey Studio</b><span>Experia · Site preparation</span></div>
  <div class="sitepick"><select id="sitesel" aria-label="Site"></select><button class="btn small" id="newsite">+ Site</button></div>
  <div class="laserchip" id="laserchip"><span class="dot"></span><span class="lv" id="lv">Laser off</span><button class="btn small" id="lconnect">Connect laser</button></div>
</header>
<div class="targetbar" id="targetbar" hidden></div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Survey steps"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* =====================================================================
   1. MASTER REQUIREMENTS LIBRARY  (EXAMPLE VALUES — replace via Library)
   Columns: Category, Requirement, Spec, Type(M/C/O), Responsibility,
            Verify(Laser/Meter/Visual/Document), Rule(>=,<=,range), Min, Max, Link(area/ceiling/door)
   ===================================================================== */
const C="Customer",E="Experia",V="Vendor",RESP=[C,E,V];
const R=(c,t,s,o={})=>({c,t,s,ty:"M",r:C,v:"Visual",...o});
/* CT — built from Experia "Site Requirements and Responsibility Matrix – CT 5300" (Matrix)
   plus Philips iCT site preparation package JO-24-00007 Rev A (SPS = specifications, SPD = drawings).
   Generic rows apply to every CT model; "only" rows and "m" overrides apply to the named model. */
const CT_REQS=[
 R("Electrical","Main power cable","3-phase, 5-wire (L1, L2, L3, N, PE), 380/400 VAC",{src:"Matrix E1",m:{ICT:{s:"3-phase wye: L1, L2, L3 + PE1 + PE2 to PDU, 380/400/415/480 VAC",src:"SPS §3.2.2"}}}),
 R("Electrical","Supply voltage (L-L, measured)","380/400 VAC ± 10 %",{v:"Meter",op:"range",mn:342,mx:440,src:"SPS §3.2.3"}),
 R("Electrical","Power capacity","115 kVA",{v:"Document",src:"Matrix E1",m:{ICT:{s:"175 kVA momentary (5 s), 25 kVA steady; 225 kVA isolation transformer if a separate source is needed",src:"SPS §3.2.3"}}}),
 R("Electrical","Power box / main breaker","MCCB 125 A + earth busbar + neutral busbar",{src:"Matrix E2",m:{ICT:{s:"Room safety disconnect 200 A @ 380/400/415 V, Class B slow-trip, lockable",src:"SPS §3.2.3, Annex"}}}),
 R("Electrical","Earth-leakage breaker (RCD)","30 mA, 200 A, Type B, 70 mm² terminals, if local code requires",{ty:"C",only:["ICT"],src:"SPS §3.2.4"}),
 R("Electrical","Earthing","One earth reference terminal with removable link; earth resistance < 5 Ω (ideal ≤ 2 Ω)",{v:"Meter",op:"<=",mx:5,src:"SPS §3.2.5"}),
 R("Electrical","Mains resistance (L-L)","≤ 105 mΩ at 400 V (100 at 380 V, 109 at 415 V)",{v:"Meter",op:"<=",mx:105,only:["ICT"],src:"SPS §3.2.3"}),
 R("Electrical","Phase imbalance","≤ 3 %",{v:"Meter",op:"<=",mx:3,only:["ICT"],src:"SPS §3.2.3"}),
 R("Electrical","Voltage distortion (THDv)","≤ 8 %",{v:"Meter",op:"<=",mx:8,only:["ICT"],src:"SPS §3.2.3"}),
 R("Electrical","Mains switch","Control room wall, per wall provisions drawing",{only:["ICT"],src:"SPD A-1 4.1, X-3"}),
 R("Electrical","Terminal junction box","Above PDU; Philips cable to PDU ≤ 1.5 m",{only:["ICT"],src:"SPD A-1 3.4, X-3"}),
 R("Electrical","Emergency power OFF switch","Control room; latching mushroom button, N.O. contact to PDU shunt trip",{only:["ICT"],src:"SPD A-1 4.3, SPS Annex"}),
 R("Electrical","X-ray ON warning light","Above entrance door, per drawings",{src:"Matrix E3",m:{ICT:{s:"Above entrance door; relay max 6 A / 230 V, lamp response 1–1000 ms, cable to gantry",src:"SPS §3.2.7"}}}),
 R("Electrical","Door interlock contacts","Per drawings, cable routed to gantry",{ty:"C",only:["ICT"],src:"SPS §3.2.7"}),
 R("Electrical","Power outlets in exam room","Single-phase 220 V",{src:"Matrix E4",m:{ICT:{s:"2 × dedicated single-phase outlets (X-3 item 4)",src:"SPD X-3"}}}),
 R("Electrical","Power outlets under control desk","4 × single-phase 220 V",{src:"Matrix E6"}),
 R("Electrical","Lighting","Room lighting installed",{src:"Matrix E8",m:{ICT:{s:"50–100 lux operation (dimmable), 500 lux service; fixtures clear of equipment",src:"SPS §3.2.6"}}}),
 R("Electrical","Service lighting level","≥ 500 lux on the floor",{v:"Meter",op:">=",mn:500,only:["ICT"],src:"SPS §3.2.6"}),
 R("Network","Data outlets in exam room","Data outlets installed",{src:"Matrix E5",m:{ICT:{s:"Network connection 1 Gb RJ45 (X-3 item 5)",src:"SPD X-3"}}}),
 R("Network","Data outlets under control desk","2 × data outlets",{src:"Matrix E7"}),
 R("Network","Remote service connection","RJ45 with hospital network / internet (1000 Mbps), IP addresses allocated",{src:"SPD A-1, SPS §3.4"}),
 R("Mechanical","AC – CT exam room","4 Ton (2 × 2 Ton split units)",{src:"Matrix M1"}),
 R("Mechanical","Heat load – exam room","Equipment ≈ 5 kW + room volume and people",{v:"Document",src:"Matrix comment",m:{ICT:{s:"Gantry 9.63 kW + room volume and people",src:"SPS §4.2"}}}),
 R("Mechanical","AC – control room","1.5 Ton × 1",{src:"Matrix M2",m:{ICT:{s:"1.5 Ton × 1; equipment heat ≈ 2 kW (CRC 1.71 + monitor 0.29 kW)",src:"Matrix M2, SPS §4.2"}}}),

const DIRS=[[1,0],[0,1],[-1,0],[0,-1]], ARROW=["→","↓","←","↑"];
function planPts(p){let x=0,y=0;const pts=[[0,0]];p.walls.forEach(w=>{const d=DIRS[w.dir];x+=d[0]*w.len;y+=d[1]*w.len;pts.push([x,y])});return pts}
function planArea(p){if(!p.closed||p.walls.length<3)return null;const pts=planPts(p);let a=0;for(let i=0;i<pts.length-1;i++)a+=pts[i][0]*pts[i+1][1]-pts[i+1][0]*pts[i][1];return Math.abs(a)/2}
function planPerim(p){return p.walls.reduce((t,w)=>t+w.len,0)}
function inPoly(pt,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/((yj-yi)||1e-9)+xi))c=!c}return c}
function equipRect(e){const L=LIB[e.dev]||{foot:[2,4],mfoot:{}};const mk=(site().mkey||{})[e.dev]||"";const [w,l]=(L.mfoot||{})[mk]||L.foot;const hw=(e.rot?w:l)/2,hh=(e.rot?l:w)/2;return [[e.x-hw,e.y-hh],[e.x+hw,e.y-hh],[e.x+hw,e.y+hh],[e.x-hw,e.y+hh]]}
function equipFits(e,p){if(!p.closed)return null;const pts=planPts(p);return equipRect(e).every(c=>inPoly(c,pts))}
function addWall(len){const p=site().plan;if(p.closed){toast("Room is closed. Undo a wall to continue.");return}
  if(!(len>0.05)){toast("Wall length must be more than 0.05 m");return}
  p.walls.push({dir:p.nextDir,len:Math.round(len*1000)/1000});
  if(p.autoTurn)p.nextDir=(p.nextDir+1)%4;
  const pts=planPts(p),end=pts[pts.length-1],gap=Math.hypot(end[0],end[1]);
  if(p.walls.length>=4&&gap<0.12){p.closed=true;p.gap=gap;toast("Room closed automatically · closure error "+f2(gap)+" m")}
  save();
}
function closeRoom(){const p=site().plan;if(p.walls.length<2){toast("Measure at least two walls first");return}
  let pts=planPts(p),[x,y]=pts[pts.length-1];
  if(Math.abs(x)>0.05&&Math.abs(y)>0.05){p.walls.push({dir:x>0?2:0,len:Math.abs(x)});x=0}
  pts=planPts(p);[x,y]=pts[pts.length-1];
  if(Math.abs(y)>0.05)p.walls.push({dir:y>0?3:1,len:Math.abs(y)},);
  else if(Math.abs(x)>0.05)p.walls.push({dir:x>0?2:0,len:Math.abs(x)});

const SVC="02a6c0d0-0451-4000-b000-fb3210111989", CHR="02a6c0d1-0451-4000-b000-fb3210111989";
const CMD_SYNC=[0xC0,0x55,0x02,0x01,0x00,0x1A];
const LZ={dev:null,write:null,last:null,lastAt:0};
let target=null; // {key,label,apply(v)}
async function laserConnect(){
  if(!navigator.bluetooth){toast("Open this page in Bluefy to use the laser");return}
  try{
    LZ.dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"GLM"},{services:[SVC]}],optionalServices:[SVC]});
    LZ.dev.addEventListener("gattserverdisconnected",()=>{laserUI(false);toast("Laser disconnected")});
    const server=await LZ.dev.gatt.connect();
    let services;try{services=[await server.getPrimaryService(SVC)]}catch(e){services=await server.getPrimaryServices()}
    LZ.write=null;
    for(const sv of services){for(const c of await sv.getCharacteristics()){
      if(c.properties.notify||c.properties.indicate){c.addEventListener("characteristicvaluechanged",onLaserData);await c.startNotifications()}
      if((c.properties.write||c.properties.writeWithoutResponse)&&(!LZ.write||c.uuid===CHR))LZ.write=c}}
    if(LZ.write){const d=new Uint8Array(CMD_SYNC);LZ.write.properties.write?await LZ.write.writeValueWithResponse(d):await LZ.write.writeValueWithoutResponse(d)}
    laserUI(true);toast("Laser connected. Press measure on the laser");
  }catch(e){if(e.name!=="NotFoundError")toast("Laser: "+e.message);laserUI(false)}
}
function laserUI(on){$("#laserchip").classList.toggle("on",on);$("#lconnect").textContent=on?"Disconnect":"Connect laser";if(!on)$("#lv").textContent=LZ.last!=null?f3(LZ.last)+" m":"Laser off";else if(LZ.last==null)$("#lv").textContent="Ready"}
const f3=v=>v.toFixed(3);
function onLaserData(ev){const dv=ev.target.value;let val=null;
  if(dv.byteLength>=11){const f=dv.getFloat32(7,true);if(isFinite(f)&&f>0.04&&f<250)val=f}
  if(val===null){for(let i=0;i+4<=dv.byteLength;i++){const f=dv.getFloat32(i,true);if(isFinite(f)&&f>0.04&&f<250&&Math.abs(f*1000-Math.round(f*1000))<0.05){val=f;break}}}
  if(val===null)return;const now=Date.now();if(val===LZ.last&&now-LZ.lastAt<800)return;LZ.last=val;LZ.lastAt=now;reading(val)}
function reading(v){
  const lv=$("#lv");lv.textContent=f3(v)+" m";lv.classList.remove("flash");void lv.offsetWidth;lv.classList.add("flash");
  if(target){const t=target;t.apply(Math.round(v*1000)/1000);toast(t.label+" ← "+f3(v)+" m")}
  else toast("Reading "+f3(v)+" m. Tap ◎ on an item to send readings there");
}

function drawPlan(ctx,W,H,s,opt={}){
  const p=s.plan,css=getComputedStyle(document.documentElement),C=n=>css.getPropertyValue(n).trim()||"#888";
  const pts=planPts(p);
  let xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);
  p.syms.forEach(o=>{if(o.t==="equip"){equipRect(o).forEach(c=>{xs.push(c[0]);ys.push(c[1])})}else{xs.push(o.x);ys.push(o.y)}});
  if(p.walls.length===0){xs.push(0,6);ys.push(0,5)}
  let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const bw=Math.max(maxx-minx,2),bh=Math.max(maxy-miny,2),M=56;
  const sc=Math.min((W-2*M)/bw,(H-2*M)/bh,140);

  const X=x=>ox+x*sc,Y=y=>oy+y*sc; if(!opt.export)view={sc,ox,oy};
  ctx.fillStyle=opt.export?"#ffffff":C("--panel");ctx.fillRect(0,0,W,H);
  const gx0=Math.floor((0-ox)/sc*2)/2,gx1=(W-ox)/sc,gy0=Math.floor((0-oy)/sc*2)/2,gy1=(H-oy)/sc;
  for(let g=gx0;g<=gx1;g+=0.5){ctx.strokeStyle=Math.abs(g%1)<1e-6?(opt.export?"#cfdfe2":C("--grid-major")):(opt.export?"#e9f1f2":C("--grid"));ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(X(g))+.5,0);ctx.lineTo(Math.round(X(g))+.5,H);ctx.stroke()}
  for(let g=gy0;g<=gy1;g+=0.5){ctx.strokeStyle=Math.abs(g%1)<1e-6?(opt.export?"#cfdfe2":C("--grid-major")):(opt.export?"#e9f1f2":C("--grid"));ctx.beginPath();ctx.moveTo(0,Math.round(Y(g))+.5);ctx.lineTo(W,Math.round(Y(g))+.5);ctx.stroke()}
  const ink=opt.export?"#0f2a33":C("--ink"),acc=opt.export?"#0b6e7f":C("--accent"),bg=opt.export?"#ffffff":C("--panel");
  if(p.closed&&pts.length>3){ctx.fillStyle=opt.export?"rgba(11,110,127,.06)":"rgba(11,110,127,.08)";ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();ctx.fill()}
  ctx.strokeStyle=opt.export?"#7a8b90":C("--muted");ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=2;
  p.ink.forEach(st=>{ctx.beginPath();st.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.stroke()});
  ctx.strokeStyle=ink;ctx.lineWidth=7;ctx.lineCap="square";
  for(let i=0;i<pts.length-1;i++){ctx.beginPath();ctx.moveTo(X(pts[i][0]),Y(pts[i][1]));ctx.lineTo(X(pts[i+1][0]),Y(pts[i+1][1]));ctx.stroke()}
  ctx.font="600 13px JetBrains Mono, Menlo, monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  p.walls.forEach((w,i)=>{const a=pts[i],b=pts[i+1],d=DIRS[w.dir],nx=d[1],ny=-d[0];
    const mx=X((a[0]+b[0])/2)+nx*24,my=Y((a[1]+b[1])/2)+ny*24;const t=w.len.toFixed(2)+" m";const tw=ctx.measureText(t).width+12;
    ctx.fillStyle=acc;ctx.fillRect(mx-tw/2,my-11,tw,22);ctx.fillStyle=bg;ctx.fillText(t,mx,my)});
  if(!p.closed){const e=pts[pts.length-1],d=DIRS[p.nextDir];const ex=X(e[0]),ey=Y(e[1]);
    ctx.fillStyle=opt.export?"#c26a12":C("--signal");ctx.beginPath();ctx.arc(ex,ey,7,0,7);ctx.fill();
    if(!opt.export){ctx.strokeStyle=C("--signal");ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+d[0]*60,ey+d[1]*60);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();const tx=ex+d[0]*70,ty=ey+d[1]*70;ctx.moveTo(tx+d[0]*10,ty+d[1]*10);ctx.lineTo(tx-d[1]*8,ty+d[0]*8);ctx.lineTo(tx+d[1]*8,ty-d[0]*8);ctx.closePath();ctx.fill()}}
  const area=planArea(p);

function setupPlan(){

  cv.onpointerdown=e=>{e.preventDefault();closePop();const [mx,my,px,py]=toM(e);

    if(tool==="erase"){let best=-1,bd=0.5/1;p.syms.forEach((o,i)=>{const d=Math.hypot(o.x-mx,o.y-my);if(d<Math.max(bd,0.6)&&(best<0||d<bd)){best=i;bd=d}});
      if(best>=0){p.syms.splice(best,1)}else{const si=p.ink.findIndex(st=>st.some(q=>Math.hypot(q[0]-mx,q[1]-my)<0.3));if(si>=0)p.ink.splice(si,1)}save();redraw();return}
    if(tool==="equip"){const ex=p.syms.find(o=>o.t==="equip"&&inPoly([mx,my],equipRect(o)));if(ex){ex.rot=ex.rot?0:1;save();redraw();return}
      const dev=s.devices[0];if(!dev){toast("Pick equipment in step 1 first");return}p.syms.push({t:"equip",x:Math.round(mx*10)/10,y:Math.round(my*10)/10,rot:0,dev});save();redraw();
      const o=p.syms[p.syms.length-1];if(equipFits(o,p)===false)toast("Equipment footprint does not fit here");return}
    const o={t:tool,x:Math.round(mx*20)/20,y:Math.round(my*20)/20};if(tool==="door")o.w="";else o.h="";p.syms.push(o);save();redraw();openPop(o,px,py,redraw)};

  let y=230;const k=[["READINESS",st.pct+"%","#0f2a33"],["APPLICABLE",st.total,"#0f2a33"],["NOT OK",st.bad,"#c0392b"],["OPEN",st.open,"#7d8b91"],["AREA",area!==null?f2(area)+" m²":"—","#0f2a33"]];
  const kw=(W-2*pad-4*16)/5;k.forEach((t,i)=>{const xx=pad+i*(kw+16);x.strokeStyle="#d6e0e3";x.lineWidth=2;x.strokeRect(xx,y,kw,110);x.fillStyle="#5b7079";x.font="600 17px Arial";x.fillText(t[0],xx+16,y+34);x.fillStyle=t[2];x.font="800 40px Arial";x.fillText(String(t[1]),xx+16,y+86)});
  y+=150;
  if(planH){x.fillStyle="#0f2a33";x.font="700 28px Arial";x.fillText("Room plan",pad,y+10);y+=30;const pc=document.createElement("canvas");pc.width=W-2*pad;pc.height=planH;drawPlan(pc.getContext("2d"),pc.width,pc.height,s,{export:true});x.drawImage(pc,pad,y);x.strokeStyle="#d6e0e3";x.strokeRect(pad,y,pc.width,planH);y+=planH+40}
  x.fillStyle="#0f2a33";x.font="700 28px Arial";x.fillText("Actions required ("+fails.length+")",pad,y+10);y+=50;
  if(!fails.length){x.fillStyle="#5b7079";x.font="22px Arial";x.fillText("No failed items.",pad,y);y+=40}
  items.forEach(it=>{x.fillStyle="#c0392b";x.fillRect(pad-18,y-22,6,it.h.length*32+it.b.length*30-6);x.fillStyle="#0f2a33";x.font="700 24px Arial";it.h.forEach(l=>{x.fillText(l,pad,y);y+=32});x.fillStyle="#5b7079";x.font="22px Arial";it.b.forEach(l=>{x.fillText(l,pad,y);y+=30});y+=18});
  x.fillStyle="#7d8b91";x.font="18px Arial";x.fillText("Experia Healthcare Systems · Survey Studio · "+st.open+" items still open",pad,H-30);
  return c.toDataURL("image/png");
}
function canShareFile(blob,name,mime){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:mime})]}))}catch(e){return false}}
function deliver(title,blob,name,mime,fallback){
  const url=URL.createObjectURL(blob),share=canShareFile(blob,name,mime);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>${esc(title)}</h2><p class="hint" style="margin:4px 0 0">${esc(name)} · ${Math.max(1,Math.round(blob.size/1024))} KB is ready. Try these in order.</p>
   <div class="dl">
     <button class="btn primary" id="d-share" ${share?"":"disabled"}>1 · Share / Save to Files</button>
     <a class="btn" href="${url}" target="_blank" rel="noopener">2 · Open in new tab</a>
     <button class="btn" id="d-here">3 · Open in this tab</button>
     <a class="btn" href="${url}" download="${esc(name)}">4 · Download</a>
   </div>
   <p class="hint">In option 2 or 3, use the browser's share or menu button to save the file. Your survey stays saved; come back with the Back arrow.</p>
   <div class="fb">${fallback||""}</div>
   <p class="hint" style="margin-top:10px">Device check: share ${navigator.share?"yes":"no"} · share files ${share?"yes":"no"}</p>
   <div class="row" style="margin-top:8px"><button class="btn" data-close>Close</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",async e=>{const t=e.target;
    if(t===m||t.dataset.close!==undefined){m.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return}
    if(t.id==="d-share"){try{await navigator.share({files:[new File([blob],name,{type:mime})],title:name})}catch(err){if(err.name!=="AbortError")toast("Share didn't work here. Try option 2")}}
    if(t.id==="d-here"){const r=new FileReader();r.onload=()=>{location.href=r.result};r.readAsDataURL(blob)}
    if(t.dataset.copy!==undefined){copyText(m.querySelector(t.dataset.copy))}
  });
  return m;
}
const safeName=s=>s.name.replace(/[^\w\-]+/g,"_").slice(0,40);
async function backupJSON(s){const copy=JSON.parse(JSON.stringify(s));copy.photoData={};for(const r in copy.survey){for(const p of copy.survey[r].photos||[]){const d=await getPhoto(p);if(d)copy.photoData[p]=d}}return JSON.stringify(copy)}
async function backupSite(s){const json=await backupJSON(s);const light=JSON.parse(json);delete light.photoData;
  deliver("Backup "+s.name,new Blob([json],{type:"application/json"}),safeName(s)+"_backup.json","application/json",
   `<b>If no option works:</b> copy the backup code (without photos) and paste it into Notes or an email to yourself.<pre class="csv" id="bkcode">${esc(JSON.stringify(light))}</pre><button class="btn small" data-copy="#bkcode">Copy backup code</button>`)}
function restorePrompt(){const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>Restore a site</h2><p class="hint">Choose a backup file, or paste a backup code.</p>
  <label class="btn photobtn" style="margin:8px 0">Choose backup file<input type="file" accept=".json,application/json" id="rfile"></label>
  <textarea id="rcode" rows="5" placeholder="Paste backup code here" style="font-family:var(--f-mono);font-size:12px"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="rgo">Restore code</button><button class="btn" data-close>Close</button></div></div>`;
  document.body.appendChild(m);
  const doRestore=async t=>{try{const s=JSON.parse(t);if(!s.survey||!s.plan)throw 0;for(const p in (s.photoData||{}))await putPhoto(p,s.photoData[p]);delete s.photoData;s.id="S"+Date.now().toString(36);state.sites.push(s);state.cur=state.sites.length-1;save();m.remove();render();toast("Site restored")}catch(e){toast("That is not a Survey Studio backup")}};
  m.querySelector("#rfile").onchange=async e=>{const f=e.target.files[0];if(f)doRestore(await f.text())};
  m.querySelector("#rgo").onclick=()=>doRestore(m.querySelector("#rcode").value.trim());
  m.onclick=e=>{if(e.target===m||e.target.dataset.close!==undefined)m.remove()}}
function nextVisit(){const s=site();const n=JSON.parse(JSON.stringify(s));n.id="S"+Date.now().toString(36);n.visit=(s.visit||1)+1;n.example=false;
  n.name=s.name.replace(/ · Visit \d+$/,"")+" · Visit "+n.visit;n.date=new Date().toISOString().slice(0,10);
  for(const k in n.survey){const v=n.survey[k];if(v.status==="bad")n.survey[k]={status:"",measured:"",comment:"",photos:[],prev:{comment:v.comment,measured:v.measured}};else if(v.status==="ok"){v.carried=true}}
  state.sites.push(n);state.cur=state.sites.length-1;state.step=2;state.filter="open";save();render();toast("Visit "+n.visit+" created with open and failed items")}

/* ---- library ---- */
const LIBHEAD=["Device","Model","Category","Requirement","Spec","Type","Responsibility","Verify","Rule","Min","Max","Link","Source"];
function libRows(){const out=[];
  Object.entries(LIB).forEach(([k,d])=>{
    d.reqs.filter(r=>!r.only).forEach(r=>out.push([d.name,"",r.cat,r.text,r.spec,r.type,r.resp,r.verify,r.op,r.min??"",r.max??"",r.link,r.src]));
    Object.entries(d.models).filter(([mk])=>mk).forEach(([mk,mn])=>d.reqs.forEach(r=>{
      if(r.only&&r.only.includes(mk))out.push([d.name,mn,r.cat,r.text,r.spec,r.type,r.resp,r.verify,r.op,r.min??"",r.max??"",r.link,r.src]);
      else if(!r.only&&r.m[mk]){const o=r.m[mk];out.push([d.name,mn,r.cat,r.text,o.s??r.spec,r.type,r.resp,r.verify,o.op??r.op,o.mn??r.min??"",o.mx??r.max??"",r.link,o.src??r.src])}}))});
  return out}
function vLibrary(){
  const tsv=[LIBHEAD.join("\t")].concat(libRows().map(r=>r.map(c=>String(c??"").replace(/[\t\n]/g," ")).join("\t"))).join("\n");
  return `<div class="eyebrow">Master library</div><h1>Requirements library</h1>
  <p class="lede">CT is built from your responsibility matrix (CT 5300) and the Philips iCT site preparation package JO-24-00007. MRI, Cath Lab and X-ray still hold example values. Keep the library in Excel with the columns below, then copy all rows (with the header) and paste them here.</p>
  <div class="card" style="margin-bottom:14px"><h2 style="margin-bottom:8px">Column guide</h2><div class="tablewrap"><table><tbody>
    <tr><td><b>Model</b></td><td>Leave empty for rows that apply to every model. Put a model name to add a requirement for that model only, or to override the Spec / Rule of a row with the same Requirement text.</td></tr>
    <tr><td><b>Type</b></td><td>M = Mandatory, C = Conditional, O = Optional</td></tr>
    <tr><td><b>Responsibility</b></td><td>Customer, Experia or Vendor. This is the standard owner; you can change it per site.</td></tr>
    <tr><td><b>Verify</b></td><td>Laser, Meter, Visual or Document. Laser items take readings straight from the GLM.</td></tr>
    <tr><td><b>Rule / Min / Max</b></td><td><span class="mono">&gt;=</span> with Min, <span class="mono">&lt;=</span> with Max, or <span class="mono">range</span> with both. The app passes or fails the reading by itself.</td></tr>
    <tr><td><b>Link</b></td><td><span class="mono">area</span>, <span class="mono">ceiling</span> or <span class="mono">door</span> to fill the item from the room plan.</td></tr>
    <tr><td><b>Source</b></td><td>Where the requirement comes from, for example Matrix E1 or SPS §3.2.3.</td></tr></tbody></table></div></div>
  <div class="card"><h2 style="margin-bottom:8px">Paste from Excel</h2><textarea id="libpaste" rows="8" placeholder="Paste rows copied from Excel here" style="font-family:var(--f-mono);font-size:12.5px"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn primary" id="libimport">Use this library</button><button class="btn" id="libcopy">Copy current library</button>${state.libRaw?'<button class="btn warn" id="libreset">Back to built-in library</button>':""}</div>
  <pre class="csv" id="libtsv" style="margin-top:12px">${esc(tsv)}</pre></div>`;
}
function importLib(text){
  const lines=text.trim().split(/\r?\n/).map(l=>l.split("\t"));if(lines.length<2)throw new Error("Paste the header row and at least one requirement");
  const h=lines[0].map(x=>x.trim().toLowerCase());const ix=n=>h.indexOf(n);
  if(ix("device")<0||ix("requirement")<0)throw new Error("The header needs at least Device and Requirement columns");
  const raw={},rows=lines.slice(1).map(c=>{const g=n=>(ix(n)>=0?(c[ix(n)]||"").trim():"");return g}).filter(g=>g("device")&&g("requirement"));
  const devKey=n=>{const hit=Object.entries(LIB).find(([k,d])=>d.name.toLowerCase()===n.toLowerCase());return hit?hit[0]:n.toUpperCase().replace(/[^A-Z0-9]+/g,"_")};
  const modelKey=(dk,n)=>{if(!n)return "";const L=LIB[dk];const hit=L&&Object.entries(L.models).find(([k,v])=>v.toLowerCase()===n.toLowerCase());return hit?hit[0]:n.toUpperCase().replace(/[^A-Z0-9]+/g,"_")};
  const respOf=v=>{v=(v||"").toLowerCase();return v.startsWith("exp")?E:v.startsWith("ven")||v.startsWith("sup")||v.startsWith("phil")?V:C};
  const obj=g=>({c:g("category")||"Other",t:g("requirement"),s:g("spec"),ty:(g("type")||"M").toUpperCase().slice(0,1),r:respOf(g("responsibility")),v:g("verify")||"Visual",op:g("rule"),mn:g("min"),mx:g("max"),ln:g("link").toLowerCase(),src:g("source")});
  [false,true].forEach(pass=>rows.forEach(g=>{const dn=g("device"),dk=devKey(dn),mn=g("model"),mk=modelKey(dk,mn);if(!!mk!==pass)return;
    const old=LIB[dk];raw[dk]=raw[dk]||{name:dn,foot:old?old.foot:[2,4],mfoot:old?old.mfoot:{},models:{"":old?(old.models[""]||"Standard"):"Standard"},reqs:[]};
    const D=raw[dk],o=obj(g);
    if(!mk){D.reqs.push(o);return}
    D.models[mk]=mn;const gen=D.reqs.find(r=>r.t===o.t&&!r.only);
    if(gen){gen.m=gen.m||{};gen.m[mk]={s:o.s,op:o.op,mn:o.mn,mx:o.mx,src:o.src}}
    else{const ex=D.reqs.find(r=>r.t===o.t&&r.only);if(ex)ex.only.push(mk);else D.reqs.push({...o,only:[mk]})}}));
  if(!Object.keys(raw).length)throw new Error("No requirement rows found");return raw;
}
function empty(t,d,step){return `<div class="card"><h2>${t}</h2><p class="lede" style="margin:6px 0 14px">${d}</p><button class="btn primary" data-go="${step}">Go to step ${step+1}</button></div>`}

/* =====================================================================
   8. RENDER + EVENTS
   ===================================================================== */
function render(){
  renderSitePicker();renderRail();closePop();
  $("#main").innerHTML=[vSite,vReqs,vSurvey,vPlan,vReport,vLibrary][state.step]();
  if(state.step===3){setupPlan();if(!target||target.key==="wall"||target.key==="pop"||(target.key==="ceiling"&&num(site().plan.ceiling)!==null))setTarget(planTargetDefault())}
  else if(state.step!==2&&target)setTarget(null);
  renderTargetBar();hydratePhotos();
  document.documentElement.style.setProperty("--topH",$("#top").offsetHeight+"px");
  bindStep();
}
function bindStep(){
  const s=site(),b=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
  b("dupsite",()=>{const n=JSON.parse(JSON.stringify(s));n.id="S"+Date.now().toString(36);n.name+=" (copy)";n.example=false;state.sites.push(n);state.cur=state.sites.length-1;save();render();toast("Site duplicated")});
  b("delsite",e=>{const btn=e.target;if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent="Tap again to delete";setTimeout(()=>{btn.textContent="Delete site";delete btn.dataset.arm},2500);return}
    state.sites.splice(state.cur,1);if(!state.sites.length)state.sites.push(blankSite("New site 1"));state.cur=0;save();render();toast("Site deleted")});
  b("laserrun",()=>{const nxt=applicable(s).find(x=>laserable(x)&&!(s.survey[x.id]||{}).measured&&(s.survey[x.id]||{}).status!=="na")||applicable(s).find(laserable);
    if(!nxt){toast("No laser items in this survey");return}setTarget(surveyTarget(nxt));render();scrollToTarget();if(!LZ.dev||!LZ.dev.gatt.connected)toast("Connect the laser, or type readings")});
  // plan
  b("addwall",()=>{const v=num($("#wallmanual").value);if(v===null){toast("Type a wall length in metres");return}addWall(v);render()});
  b("undowall",()=>{const p=s.plan;const w=p.walls.pop();if(w){p.nextDir=w.dir;p.closed=false;p.gap=null}save();render()});
  b("closeroom",()=>{closeRoom();render()});
  b("clearplan",e=>{const btn=e.target;if(!btn.dataset.arm){btn.dataset.arm=1;btn.textContent="Tap again";setTimeout(()=>{btn.textContent="Clear";delete btn.dataset.arm},2500);return}s.plan=blankPlan();save();render();toast("Plan cleared")});
  b("ceiltg",()=>{setTarget(target&&target.key==="ceiling"?planTargetDefault():ceilTarget());render()});
  const at=$("#autoturn");if(at)at.onchange=()=>{s.plan.autoTurn=at.checked;save()};
  const ce=$("#ceil");if(ce)ce.onchange=()=>{s.plan.ceiling=ce.value.trim()===""?"":f2(num(ce.value)??0);save();render()};
  // report
  b("mkpdf",async e=>{const btn=e.target;btn.disabled=true;btn.textContent="Building PDF…";
    let blob=null,err="";try{blob=await buildPDF(s)}catch(x){err=x.message||"PDF maker failed"}
    btn.disabled=false;btn.textContent="Create PDF report";const img=reportImage(s);
    const fb=`<b>If no option works:</b> press and hold the report image below, then choose <b>Save to Photos</b> or <b>Share</b>.<img class="fbimg" src="${img}" alt="Report image">`;
    if(blob)deliver("PDF report",blob,safeName(s)+"_report.pdf","application/pdf",fb);
    else{const ib=await (await fetch(img)).blob();toast(err);deliver("Report image (PDF needs internet)",ib,safeName(s)+"_report.png","image/png",fb)}});
  b("dlcsv",()=>{const st=stats(s);deliver("Excel sheet",new Blob([toCSV(s,st)],{type:"text/csv"}),safeName(s)+"_survey.csv","text/csv",
    `<b>If no option works:</b> copy the table, open Excel on the iPad and paste it.<pre class="csv" id="cpt">${esc(toTSV(s,st))}</pre><button class="btn small" data-copy="#cpt">Copy table</button>`)});
  b("dlplan",async()=>{const d=planImage(s,1600,1140);const blob=await (await fetch(d)).blob();deliver("Room plan image",blob,safeName(s)+"_plan.png","image/png",
    `<b>If no option works:</b> press and hold the plan below and choose <b>Save to Photos</b>.<img class="fbimg" src="${d}" alt="Room plan">`)});
  b("backup",()=>backupSite(s));b("restore",restorePrompt);b("visit2",nextVisit);
  b("copytsv",()=>copyText($("#tsv")));
  // library
  b("libimport",()=>{try{const raw=importLib($("#libpaste").value);state.libRaw=raw;LIB=buildLib(raw);save();render();toast("Library loaded: "+Object.keys(raw).length+" devices")}catch(e){toast(e.message)}});
  b("libcopy",()=>copyText($("#libtsv")));
  b("libreset",()=>{state.libRaw=null;LIB=buildLib(DEFAULT_LIB);save();render();toast("Built-in library restored")});
}
function copyText(el){const t=el.textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied. Paste into Excel")).catch(()=>{const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Selected. Tap Copy")})}

$("#main").addEventListener("click",async e=>{
  const t=e.target.closest("button,img[data-view]");if(!t)return;const s=site(),d=t.dataset;
  if(d.go){go(+d.go);return}
  if(d.dev){s.devices=s.devices.includes(d.dev)?s.devices.filter(x=>x!==d.dev):[...s.devices,d.dev];save();render();return}
  if(d.sel){s.sel[d.sel]=d.v;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.resp){s.resp[d.resp]=d.v;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.allresp!==undefined){s.devices.forEach(dv=>devReqs(s,dv).forEach(r=>{if(d.allresp)s.resp[r.id]=d.allresp;else delete s.resp[r.id]}));s.extras.forEach(x=>{if(d.allresp)s.resp[x.id]=d.allresp});save();render();toast(d.allresp?"All items set to "+d.allresp:"Standard owners restored");return}
  if(d.addx){const k=d.addx,tx=$("#xt-"+CSS.escape(k)).value.trim();if(!tx){toast("Type the extra requirement first");return}
    s.extras.push({id:"X"+Date.now().toString(36),device:k,cat:$("#xc-"+CSS.escape(k)).value,text:tx,spec:$("#xs-"+CSS.escape(k)).value.trim(),resp:C});save();render();toast("Extra requirement added");return}
  if(d.delx){s.extras=s.extras.filter(x=>x.id!==d.delx);save();render();return}
  if(d.filter){state.filter=d.filter;save();render();return}
  if(d.st){const v=sv(s,d.st);v.status=v.status===d.v?"":d.v;v.auto=false;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.tgt){const r=applicable(s).find(x=>x.id===d.tgt);if(target&&target.key===d.tgt)setTarget(null);else setTarget(surveyTarget(r));const y=scrollY;render();scrollTo(0,y);return}
  if(d.tool){tool=d.tool;closePop();document.querySelectorAll(".tool").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===tool));return}
  if(d.dir!==undefined){s.plan.nextDir=+d.dir;save();setTarget(planTargetDefault());render();return}
  if(d.view){const src=await getPhoto(d.view);const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="card"><img src="${src}" alt="Photo"><div class="row" style="margin-top:10px"><button class="btn" data-close>Close</button>${d.item?`<button class="btn warn" data-delph>Delete photo</button>`:""}</div></div>`;
    document.body.appendChild(m);m.onclick=ev=>{if(ev.target===m||ev.target.dataset.close!==undefined)m.remove();if(ev.target.dataset.delph!==undefined){const v=sv(s,d.item);v.photos=v.photos.filter(p=>p!==d.view);save();m.remove();render()}}}
});
$("#main").addEventListener("input",e=>{const t=e.target,s=site();
  if(t.id==="f-name"){s.name=t.value;save();renderSitePicker()}
  if(t.id==="f-loc"){s.loc=t.value;save()} if(t.id==="f-date"){s.date=t.value;save()} if(t.id==="f-surveyor"){s.surveyor=t.value;save()}
  if(t.dataset.model){s.models[t.dataset.model]=t.value;save()}
  if(t.dataset.com){sv(s,t.dataset.com).comment=t.value;save()}
});
$("#main").addEventListener("change",async e=>{const t=e.target,s=site();
  if(t.dataset.mkey){s.mkey[t.dataset.mkey]=t.value;save();render();toast("Requirement profile: "+t.options[t.selectedIndex].text);return}
  if(t.dataset.respsel){s.resp[t.dataset.respsel]=t.value;save();const y=scrollY;render();scrollTo(0,y);toast("Owner changed to "+t.value);return}
  if(t.dataset.meas){const r=applicable(s).find(x=>x.id===t.dataset.meas);setMeasured(s,r,t.value.trim(),true);save();const y=scrollY;render();scrollTo(0,y)}
  if(t.dataset.wlen!==undefined){const v=num(t.value);if(v&&v>0.05){s.plan.walls[+t.dataset.wlen].len=v;const pts=planPts(s.plan),e2=pts[pts.length-1];if(s.plan.closed)s.plan.gap=Math.hypot(e2[0],e2[1]);save();render()}}
  if(t.dataset.photo&&t.files&&t.files[0]){try{const data=await compress(t.files[0]);const id="P"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await putPhoto(id,data);sv(s,t.dataset.photo).photos.push(id);save();const y=scrollY;render();scrollTo(0,y);toast("Photo added")}catch(err){toast("Couldn't read that photo")}}
});
$("#main").addEventListener("focusin",e=>{const t=e.target,s=site();
  if(t.dataset.meas){const r=applicable(s).find(x=>x.id===t.dataset.meas);if(r&&(r.verify==="Laser")&&(!target||target.key!==r.id)){setTarget(surveyTarget(r));document.querySelectorAll(".req.targeted").forEach(x=>x.classList.remove("targeted"));const row=document.getElementById("row-"+r.id);if(row)row.classList.add("targeted")}}
  if(t.id==="ceil")setTarget(ceilTarget());
});
render();
